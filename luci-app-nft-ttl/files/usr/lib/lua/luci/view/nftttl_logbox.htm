<div class="cbi-section" style="margin-top:15px;">
  <h3>TTL Log</h3>
  <textarea id="ttl_logbox" readonly style="width:100%;height:200px;background:#0b0b0b;color:#00ffee;font-family:monospace;border-radius:6px;padding:6px;">Loading TTL logs...</textarea>
  <div style="margin-top:10px;">
    <input type="button" class="btn cbi-button cbi-button-apply" value="Ping Test (google.com)" onclick="pingTTLTest()" />
  </div>
  <pre id="ping_result" style="margin-top:10px;background:#111;color:#0f0;padding:8px;border-radius:6px;display:none;"></pre>
</div>

<script type="text/javascript">
function showToast(msg, color) {
  var toast = document.createElement("div");
  toast.textContent = msg;
  toast.style.position = "fixed";
  toast.style.top = "20px";
  toast.style.right = "20px";
  toast.style.padding = "10px 20px";
  toast.style.background = color || "#007bff";
  toast.style.color = "#fff";
  toast.style.borderRadius = "6px";
  toast.style.zIndex = 9999;
  toast.style.boxShadow = "0 0 10px rgba(0,0,0,0.5)";
  document.body.appendChild(toast);
  setTimeout(function(){ toast.remove(); }, 4000);
}

function refreshTTLLog() {
  XHR.get('/cgi-bin/luci/admin/modem/nftttl/action?status=log', null, function(x) {
    var box = document.getElementById('ttl_logbox');
    if (x.responseText) box.value = x.responseText.trim();
    box.scrollTop = box.scrollHeight;
    var lines = box.value.split("\n");
    var last = lines[lines.length - 1] || "";
    if (last.match(/enabled/i)) showToast("TTL Enabled", "#00b894");
    else if (last.match(/disabled/i)) showToast("TTL Disabled", "#e17055");
  });
}

function pingTTLTest() {
  var result = document.getElementById('ping_result');
  result.style.display = "block";
  result.textContent = "Pinging google.com...\n";
  XHR.get('/cgi-bin/luci/admin/modem/nftttl/action?status=pingtest', null, function(x) {
    result.textContent = x.responseText.trim() || "No response.";
  });
}

setInterval(refreshTTLLog, 2000);
refreshTTLLog();
</script>
